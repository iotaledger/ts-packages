name: Preview Deploy for IOTA Names

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "sdk/**"
      - "dapp/**"
      - ".github/workflows/iota_names.preview_deploy.yml"
      - ".github/workflows/iota_names_deploy.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: (github.event.pull_request.draft == false || contains(github.event.pull_request.body, '[run-ci]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
      issues: write

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.IOTA_NAMES_VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_APPS_BACKEND: ${{ secrets.STAGING_APPS_BACKEND }}
      NEXT_PUBLIC_NAMES_DAPP_CONFIG: ${{ secrets.NAMES_DAPP_CONFIG }}
      NEXT_PUBLIC_NAMES_DAPP_DEFAULT_NETWORK: devnet
      NEXT_PUBLIC_NAMES_DAPP_FORBIDDEN_LIST: ${{ secrets.NAMES_DAPP_FORBIDDEN_LIST }}

    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Enable corepack (creates pnpm shim for Vercel CLI subprocess)
        run: corepack enable

      - name: Debug pnpm/corepack locations
        run: |
          echo "PATH=$PATH"
          echo "---"
          echo "which pnpm: $(which pnpm 2>&1)"
          echo "which -a pnpm: $(which -a pnpm 2>&1 || true)"
          echo "---"
          echo "PNPM_HOME contents:"
          ls -la "$PNPM_HOME" 2>&1 || echo "PNPM_HOME dir missing"
          echo "---"
          echo "Node bin contents (pnpm-related):"
          ls -la "$(dirname "$(which node)")" 2>&1 | grep -iE "pnpm|corepack" || true
          echo "---"
          echo "corepack version: $(corepack --version 2>&1)"
          echo "node version: $(node --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add --global vercel@canary

      - name: Pull Vercel Environment Information
        run: vercel pull --token=${{ secrets.VERCEL_TOKEN }} --yes --environment=preview

      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }} --target=preview

      - name: Deploy to Vercel
        uses: iotaledger/deploy-to-vercel-action@9c73fe8ff3eb32d6ba30d623ac1b0c5708a25bb7
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREBUILT: true
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          VERCEL_PROJECT_ID: ${{ secrets.IOTA_NAMES_VERCEL_PROJECT_ID }}
          DELETE_EXISTING_COMMENT: true
          VERCEL_TARGET: preview
          CREATE_COMMENT: true

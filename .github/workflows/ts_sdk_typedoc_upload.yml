name: TS SDK Typedoc Upload

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    env:
      S3_URI: s3://files.iota.org/iota-wiki/ts-sdk-typedoc.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm sdk-packages build

      - name: Generate typedoc
        run: pnpm docs:sdk

      - name: Compress generated docs
        run: tar czvf ts-sdk-typedoc.tar.gz -C generated-docs .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_IOTA_WIKI }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_IOTA_WIKI }}
          aws-region: eu-central-1

      - name: Upload to S3
        run: aws s3 cp ts-sdk-typedoc.tar.gz "$S3_URI" --acl public-read

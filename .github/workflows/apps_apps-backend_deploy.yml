name: Deploy Apps-Backend

on:
  push:
    branches: [develop]
    paths:
      - "apps/apps-backend/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      deploy_type:
        description: "Deploy type"
        required: true
        type: choice
        options:
          - staging
          - rc
          - production

concurrency:
  group: apps-backend-deploy-${{ github.workflow }}-${{ inputs.deploy_type || 'staging' }}
  cancel-in-progress: true

jobs:
  resolve-deploy-type:
    runs-on: ubuntu-latest
    outputs:
      deploy_type: ${{ steps.resolve.outputs.deploy_type }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve deploy type
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DEPLOY_TYPE="staging"
          else
            DEPLOY_TYPE="${{ inputs.deploy_type }}"
          fi

          if [ "$DEPLOY_TYPE" = "staging" ] || [ "$DEPLOY_TYPE" = "rc" ]; then
            ENVIRONMENT="pre-production - apps-backend"
          else
            ENVIRONMENT="production - apps-backend"
          fi

          echo "deploy_type=$DEPLOY_TYPE" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: resolve-deploy-type
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy-type.outputs.environment }}

    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      version: ${{ steps.commit-hash.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get the short commit hash
        id: commit-hash
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "VERSION=$COMMIT_HASH" >> $GITHUB_ENV
          echo "version=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/apps-backend/Dockerfile
          push: true
          tags: ghcr.io/iotaledger/iota/apps-backend-${{ needs.resolve-deploy-type.outputs.deploy_type }}:${{ env.VERSION }}
          build-args: |
            DEPLOY_TYPE=${{ needs.resolve-deploy-type.outputs.deploy_type }}
            STAGING_APPS_BACKEND=${{ secrets.STAGING_APPS_BACKEND }}
            PROD_APPS_BACKEND=${{ secrets.PROD_APPS_BACKEND }}

      - name: Add SSH key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.UPDATER_SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no updater@${{ secrets.UPDATER_SSH_HOST }} "${{ needs.resolve-deploy-type.outputs.deploy_type }} ${{ env.VERSION }}"

  notify:
    needs: [resolve-deploy-type, build-and-deploy]
    if: always() && needs.build-and-deploy.result != 'skipped' && (needs.resolve-deploy-type.outputs.deploy_type == 'rc' || needs.resolve-deploy-type.outputs.deploy_type == 'production')
    uses: ./.github/workflows/_slack_notify.yml
    secrets: inherit
    with:
      status: ${{ needs.build-and-deploy.result == 'success' && 'success' || 'failure' }}
      title: "Apps Backend ${{ needs.resolve-deploy-type.outputs.deploy_type }} deploy ${{ needs.build-and-deploy.result }}"
      message: "Image: ghcr.io/iotaledger/iota/apps-backend-${{ needs.resolve-deploy-type.outputs.deploy_type }}:${{ needs.build-and-deploy.outputs.version }}"

name: Weekly pnpm Security Audit

on:
  schedule:
    - cron: "0 21 * * 0" # every Sunday at 9 PM UTC
  workflow_dispatch:

jobs:
  audit-high:
    name: pnpm audit – High & Critical
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      message: ${{ steps.parse.outputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Run pnpm audit (high)
        run: pnpm audit --prod --audit-level high --json > audit-high.json || true
      - name: Parse results
        id: parse
        run: |
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-high.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-high.json)
          TOTAL=$((CRITICAL + HIGH))

          if [ "$TOTAL" -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=:white_check_mark: No high/critical vulnerabilities found." >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=:rotating_light: *$TOTAL high/critical vulnerabilities found* — Critical: $CRITICAL | High: $HIGH" >> $GITHUB_OUTPUT
          fi

  audit-moderate:
    name: pnpm audit – Moderate
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      message: ${{ steps.parse.outputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Run pnpm audit (moderate)
        run: pnpm audit --prod --audit-level moderate --json > audit-moderate.json || true
      - name: Parse results
        id: parse
        run: |
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-moderate.json)

          if [ "$MODERATE" -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=:white_check_mark: No moderate vulnerabilities found." >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=:warning: *$MODERATE moderate vulnerabilities found*" >> $GITHUB_OUTPUT
          fi

  notify-high:
    needs: audit-high
    if: needs.audit-high.outputs.status == 'failure'
    uses: ./.github/workflows/_slack_notify.yml
    secrets:
      CI_SLACK_WEBHOOK: ${{ secrets.CI_SLACK_WEBHOOK }}
    with:
      status: ${{ needs.audit-high.outputs.status }}
      title: "Weekly pnpm Audit – High & Critical"
      message: ${{ needs.audit-high.outputs.message }}
      footer: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  notify-moderate:
    needs: audit-moderate
    if: needs.audit-moderate.outputs.status == 'failure'
    uses: ./.github/workflows/_slack_notify.yml
    secrets:
      CI_SLACK_WEBHOOK: ${{ secrets.CI_SLACK_WEBHOOK }}
    with:
      status: ${{ needs.audit-moderate.outputs.status }}
      title: "Weekly pnpm Audit – Moderate"
      message: ${{ needs.audit-moderate.outputs.message }}
      footer: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
